<!doctype html><html><head><meta charset="utf-8"><title>Jarvis Mocap</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>body{font-family:sans-serif;max-width:820px;margin:2em auto;background:#111;color:#eee}input,select,button{font-size:1em;margin:.3em 0}
.err{color:#f66}a{color:#6cf}video,model-viewer{width:100%;max-height:460px;background:#000;margin-top:1em}model-viewer{height:460px}</style></head><body>
<h2>Jarvis body mocap (InstantHMR)</h2><p><a href="/m">📱 Mobile version</a> · <a href="/app.apk">Android app (APK)</a></p>
<p>Video must be <b>60 fps or more</b> and <b>1080p or higher</b>.</p>
<label>Access key <input id=key type=password size=30></label><br>
<label>Video <input id=video type=file accept="video/*"></label><br>
<label>Character <select id=char><option value=none>None (skeleton plus MHR mesh only)</option></select></label><br>
<label>…or upload your own rigged character (.fbx/.glb/.blend, UE5 Manny bone names) <input id=cfile type=file accept=".fbx,.glb,.gltf,.blend"></label><br>
<button id=go>Upload and run</button>
<p id=msg></p><div id=out></div>
<script>
const $=i=>document.getElementById(i);$('key').value=localStorage.k||'';
async function loadChars(){const k=$('key').value;if(!k)return;const r=await fetch('/characters?key='+encodeURIComponent(k));if(!r.ok)return;
 const s=$('char');s.innerHTML='';(await r.json()).forEach(c=>s.add(new Option(c.name,c.id)));}
$('key').onchange=()=>{localStorage.k=$('key').value;loadChars()};loadChars();
$('go').onclick=async()=>{const k=$('key').value,f=$('video').files[0];if(!f){$('msg').textContent='Pick a video';return}
 const fd=new FormData();fd.append('key',k);fd.append('video',f);fd.append('character',$('char').value);if($('cfile').files[0])fd.append('character_file',$('cfile').files[0]);
 $('msg').className='';$('msg').textContent='Uploading and checking video...';$('out').innerHTML='';
 const r=await fetch('/upload',{method:'POST',body:fd});const d=await r.json();
 if(!r.ok){$('msg').className='err';$('msg').textContent=d.error;return}
 const t0=Date.now();const poll=async()=>{const s=await (await fetch(`/status/${d.job}?key=${encodeURIComponent(k)}`)).json();
  $('msg').textContent=`${s.state}: ${s.msg} (${Math.round((Date.now()-t0)/1000)} s)`;
  if(s.state=='failed'){$('msg').className='err';return}
  if(s.state!='done'){setTimeout(poll,3000);return}
  const u=n=>`/file/${d.job}/${n}?key=${encodeURIComponent(k)}`;let h='<h3>Downloads</h3><ul>'+s.files.map(n=>`<li><a href="${u(n)}&dl=1">${n}</a></li>`).join('')+'</ul>';
  if(s.files.includes('mhr_overlay.mp4'))h+=`<video controls autoplay loop muted src="${u('mhr_overlay.mp4')}"></video>`;
  if(s.files.includes('character.glb'))h+=`<model-viewer src="${u(s.files.includes('preview.glb')?'preview.glb':'character.glb')}" camera-controls autoplay animation-name="" shadow-intensity="1"></model-viewer>`;
  $('out').innerHTML=h;};poll();};
</script></body></html>
