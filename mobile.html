<!doctype html><html><head><meta charset="utf-8"><title>Jarvis Mocap</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112233">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png">
<style>body{font-family:sans-serif;margin:0;padding:16px;background:#111;color:#eee;font-size:18px}
input,select,button,.btn{display:block;width:100%;box-sizing:border-box;font-size:20px;padding:16px;margin:10px 0;border-radius:12px;border:0}
input,select{background:#222;color:#eee}button,.btn{background:#2a7;color:#fff;text-align:center;text-decoration:none;font-weight:bold}
.sec{background:#346}.err{color:#f66}progress{width:100%;height:24px}video{width:100%;border-radius:12px;background:#000}
model-viewer{width:100%;height:60vh;background:#000}label{font-size:16px;color:#aaa}</style></head><body>
<h2>📱 Jarvis Mocap</h2><a href="/?desktop=1" style="color:#6cf">Desktop version</a> · <a href="/app.apk" style="color:#6cf">Android app (APK)</a>
<a class="btn" href="/live" style="background:#c80">🏗 Live detect (scaffold parts, camera)</a>
<p style="font-size:15px">Video: 60 fps+, 1080p+ (portrait is fine).</p>
<label>Access key (remembered)</label><input id=key type=password autocomplete=off>
<label>Video (record or gallery)</label><input id=video type=file accept="video/*">
<label>Character</label><select id=char><option value=none>None (skeleton plus MHR mesh only)</option></select>
<details><summary style="font-size:16px">Use my own rigged character</summary><input id=cfile type=file accept=".fbx,.glb,.gltf,.blend"></details>
<button id=go>Upload and run</button>
<progress id=prog value=0 max=100 hidden></progress><p id=msg></p><div id=out></div>
<script>
const $=i=>document.getElementById(i);$('key').value=localStorage.k||'';
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
async function loadChars(){const k=$('key').value;if(!k)return;const r=await fetch('/characters?key='+encodeURIComponent(k));if(!r.ok)return;
 const s=$('char');s.innerHTML='';(await r.json()).forEach(c=>s.add(new Option(c.name,c.id)));}
$('key').onchange=()=>{localStorage.k=$('key').value;loadChars()};loadChars();
$('go').onclick=()=>{const k=$('key').value,f=$('video').files[0];if(!f){$('msg').textContent='Pick a video';return}
 localStorage.k=k;const fd=new FormData();fd.append('key',k);fd.append('video',f);fd.append('character',$('char').value);
 if($('cfile').files[0])fd.append('character_file',$('cfile').files[0]);
 $('out').innerHTML='';$('msg').className='';$('prog').hidden=false;$('go').disabled=true;
 const x=new XMLHttpRequest();x.open('POST','/upload');
 x.upload.onprogress=e=>{if(e.lengthComputable){$('prog').value=e.loaded/e.total*100;$('msg').textContent='Uploading '+Math.round(e.loaded/e.total*100)+'%'}};
 x.onload=()=>{$('prog').hidden=true;$('go').disabled=false;let d={};try{d=JSON.parse(x.responseText)}catch(e){}
  if(x.status!=200){$('msg').className='err';$('msg').textContent=d.error||('Error '+x.status);return}poll(d.job,k,Date.now())};
 x.onerror=()=>{$('go').disabled=false;$('msg').className='err';$('msg').textContent='Network error'};x.send(fd);};
async function poll(j,k,t0){const s=await (await fetch(`/status/${j}?key=${encodeURIComponent(k)}`)).json();
 $('msg').textContent=`${s.state}: ${s.msg} (${Math.round((Date.now()-t0)/1000)} s)`;
 if(s.state=='failed'){$('msg').className='err';return} if(s.state!='done'){setTimeout(()=>poll(j,k,t0),4000);return}
 const u=n=>`/file/${j}/${n}?key=${encodeURIComponent(k)}`;let h='';
 if(s.files.includes('mhr_overlay.mp4'))h+=`<video controls playsinline loop muted src="${u('mhr_overlay.mp4')}"></video>`;
 h+=s.files.map(n=>`<a class="btn sec" href="${u(n)}&dl=1">⬇ ${n}</a>`).join('');
 if(s.files.includes('character.glb'))h+=`<button id=v3d>Show 3D character preview</button><div id=mv></div>`;
 $('out').innerHTML=h;
 if($('v3d'))$('v3d').onclick=()=>{$('v3d').remove();const sc=document.createElement('script');sc.type='module';
  sc.src='https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js';document.head.appendChild(sc);
  $('mv').innerHTML=`<model-viewer src="${u(s.files.includes('preview.glb')?'preview.glb':'character.glb')}" camera-controls autoplay touch-action="pan-y"></model-viewer>`;};}
</script></body></html>
